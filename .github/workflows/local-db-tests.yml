name: Local SQLite editor tests

on:
  push:
    branches:
      - CacheSwap
    paths:
      - ".github/workflows/local-db-tests.yml"
      - "src/fleasion/database/**"
      - "src/fleasion/gui/local_database_editor.py"
      - "src/fleasion/gui/roblox_cache_tab.py"
      - "src/fleasion/gui/replacer_config.py"
      - "src/fleasion/tray.py"
      - "src/fleasion/app.py"
      - "src/fleasion/config/manager.py"
      - "tests/test_sqlite_browser.py"
      - "tests/test_roblox_cache_store.py"
      - "tests/test_local_database_mode.py"
  pull_request:
    branches:
      - main
    paths:
      - "src/fleasion/database/**"
      - "src/fleasion/gui/local_database_editor.py"
      - "src/fleasion/gui/replacer_config.py"
      - "src/fleasion/tray.py"
      - "src/fleasion/app.py"
      - "src/fleasion/config/manager.py"
      - "tests/test_sqlite_browser.py"
      - "tests/test_local_database_mode.py"

permissions:
  contents: read

jobs:
  sqlite-editor:
    name: SQLite editor tests (Python 3.14)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install project and test dependencies
        run: uv sync --locked --group dev

      - name: Compile modified Python modules
        run: >-
          uv run python -m py_compile
          src/fleasion/database/__init__.py
          src/fleasion/database/sqlite_browser.py
          src/fleasion/database/roblox_cache_store.py
          src/fleasion/local_database_mode.py
          src/fleasion/gui/local_database_editor.py
          src/fleasion/gui/roblox_cache_tab.py
          src/fleasion/gui/replacer_config.py
          src/fleasion/tray.py
          src/fleasion/app.py
          src/fleasion/config/manager.py
          tests/test_sqlite_browser.py
          tests/test_roblox_cache_store.py
          tests/test_local_database_mode.py

      - name: Run local database tests
        run: uv run pytest -q tests/test_sqlite_browser.py tests/test_local_database_mode.py tests/test_roblox_cache_store.py
